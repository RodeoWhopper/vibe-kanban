<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Vibe Kanban</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f8;
        --panel: #ffffff;
        --text: #18181b;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #18181b;
        --accent-text: #ffffff;
        --error: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f0f11;
          --panel: #18181b;
          --text: #f4f4f5;
          --muted: #a1a1aa;
          --border: #27272a;
          --accent: #f4f4f5;
          --accent-text: #18181b;
          --error: #f87171;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 32px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 600;
      }
      .subtitle {
        margin: 0 0 24px;
        color: var(--muted);
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
      }
      input {
        width: 100%;
        margin-bottom: 16px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      button {
        width: 100%;
        padding: 9px 12px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: var(--accent-text);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      .error {
        margin: 0 0 16px;
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vibe Kanban</h1>
      <p class="subtitle">Sign in to continue</p>
      {{error}}
      <form method="post" action="/login">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          autocomplete="username"
          required
          autofocus
        />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
