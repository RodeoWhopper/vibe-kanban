# Local Vibe Kanban server in a container.
#
#   VK_AUTH_USERNAME=dev VK_AUTH_PASSWORD='change-me' docker compose up -d --build
#
# (or put both variables in a .env file next to this file)
#
# The UI is served on http://<host>:3000. The preview proxy listens on 3001;
# keep the host and container ports identical, since the UI links to the
# preview proxy using the port the server reports.
services:
  vibe-kanban:
    build: .
    image: vibe-kanban:local
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      RUST_LOG: info
      # Single-user login. Both are required so the sandbox never starts open.
      VK_AUTH_USERNAME: ${VK_AUTH_USERNAME:?Set VK_AUTH_USERNAME}
      VK_AUTH_PASSWORD: ${VK_AUTH_PASSWORD:?Set VK_AUTH_PASSWORD}
      # Optional: Azure DevOps (cloud or on-prem Server) via personal access token.
      # AZURE_DEVOPS_EXT_PAT: ${AZURE_DEVOPS_EXT_PAT}
      # Optional: repositories cloned into /repos on first start (space or comma separated HTTPS URLs).
      # VK_GIT_REPOS: https://tfs.example.com/tfs/DefaultCollection/Project/_git/repo
      # Optional: commit identity for this sandbox's developer.
      # VK_GIT_USER_NAME: Jane Doe
      # VK_GIT_USER_EMAIL: jane@example.com
      # Optional: corporate root CA (PEM), e.g. mounted via a volume.
      # VK_EXTRA_CA_CERTS: /certs/corp-root-ca.pem
    volumes:
      # App data (SQLite DB, config) and agent credentials live under $HOME.
      - vk-home:/home/appuser
      # Repositories and worktrees the agents work on.
      - vk-repos:/repos

volumes:
  vk-home:
  vk-repos:
